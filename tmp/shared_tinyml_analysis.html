":-5,\"_795\":-5,\"_796\":-5,\"_53\":-5,\"_797\":-5},[756,757],\"stop\",\"stop_tokens\",[864],200002,\"content_type\",\"parts\",[868],\"可以，而且这条路线和你们现在的 Ti60 工程其实衔接得很好。我已经按你指定的 GitHub 仓库 `Starfall-git/fpga-w.-codex` 读取了当前 `main` 的目录、`example_top.v`、`src/`、`docs/IMAGE_PROCESSING_GUIDE.md`，并结合项目里上传的 Ti60、TinyML、Custom Instruction、DSP、OV5640 等资料分析了一遍。\\n\\n先给出一个关键结论：\\n\\n\u003e **不要把神经网络像 Sobel 一样，直接串在 `lcd_driver -\u003e rgb2dvi` 的逐像素 HDMI 流水线上。**\\n\u003e\\n\u003e 你们现在的 Sobel/中值滤波属于“1 pixel/clk 的流式图像处理”；TinyML 神经网络属于“以一帧/一个 Tensor 为单位的推理”。正确架构应该是利用你们现有的 **摄像头 + DDR3 帧缓存**，从 DDR 或摄像头支路取一份低分辨率图像给神经网络，推理结果再送回显示链路做框、标签、坐标等叠加。\\n\\n这也是把现有 FPGA 图像工程升级成真正“边缘 AI SoC”的关键一步。\\n\\n---\\n\\n# 一、先确认你们现在到底有什么\\n\\n我检查了当前 GitHub `main`。现在 `src/` 里已经有：\\n\\n`DDR3/AXI + 摄像头采集 + 图像裁剪/缩放 + RGB/灰度 + Median + Sobel + HDMI + UART 控制`\\n\\n其中当前图像处理链在仓库文档里已经被明确写成：\\n\\n```text\\nCamera\\n  ↓\\n摄像头采集 / Crop\\n  ↓\\nAXI Write\\n  ↓\\nDDR3 Frame Buffer\\n  ↓\\nAXI Read\\n  ↓\\nRGB565 → RGB888\\n  ↓\\nlcd_driver\\n  ↓\\nvideo_processing\\n ├─ Gray\\n ├─ Median\\n └─ Sobel\\n  ↓\\nrgb2dvi\\n  ↓\\nHDMI\\n```\\n\\n仓库里的 [`docs/IMAGE_PROCESSING_GUIDE.md`](https://github.com/Starfall-git/fpga-w.-codex/blob/main/docs/IMAGE_PROCESSING_GUIDE.md) 就是按这个结构描述的；当前 `video_processing` 仍然要求 **RGB、HS、VS、DE 同时逐拍前进，不支持 ready/backpressure**。\\n\\n这点非常重要，因为它说明：\\n\\n**这里适合 Sobel，不适合直接塞 TFLite。**\\n\\n另外有一个你要特别注意的版本问题：当前 `main` 的 `example_top.v` 从 V0.7 开始已经从 **OV5640 切到了 AR0135**，后续 V0.8～V0.11 的 Sobel/Median 增强是在 AR0135 路线上继续做的；原来的 OV5640 工程仍保存在：\\n\\n```text\\n02-1_Ti60_OV5640_LCD-HDMI_1080P60/\\n```\\n\\n所以如果比赛最终目标是：\\n\\n- 人脸；\\n- 手势；\\n- 多种物品；\\n- 彩色场景分类；\\n\\n我更倾向于后续 AI 版本重新以 **OV5640 彩色图像链** 为输入基础，而不是只围绕目前的 AR0135 灰度链继续扩展。\\n\\n板卡本身已经提供 CMOS 摄像头接口，包括 `PCLK / VSYNC / HREF / D[7:0] / SCLK / SDAT` 等信号。fileciteturn0file1L583-L600 OV5640 本身支持 RAW RGB、RGB565、YUV422 等输出以及 DVP 并行接口，也支持缩放、裁剪等功能。fileciteturn0file3L40-L70\\n\\n---\\n\\n# 二、神经网络加入以后，整个系统应该变成什么样\\n\\n我建议把你们最终系统理解为下面这个架构：\\n\\n```text\\n                         ┌──────────── HDMI显示支路 ──────────────┐\\n                         │                                       │\\nCamera → Capture → DDR3 Frame Buffer → Display Read → ISP → Overlay → HDMI\\n                    │\\n                    │\\n                    └──── AI支路 ────────────────────────────────┐\\n                                                                │\\n                         Crop / Resize / RGB→Gray / Normalize    │\\n                                      ↓                         │\\n                                 NN Input Tensor                 │\\n                                      ↓                         │\\n                               Sapphire RISC-V                   │\\n                                      ↓                         │\\n                              TensorFlow Lite                    │\\n                                      ↓                         │\\n                           TinyML Accelerator                    │\\n                       Conv / DWConv / Add / Mul / FC            │\\n                                      ↓                         │\\n                                  NN Output                      │\\n                                      ↓                         │\\n                  Detection / Classification / Landmark          │\\n                                      ↓                         │\\n                         bbox / class / score / XY               │\\n                                      └────────────→ Overlay ────┘\\n```\\n\\n这和易灵思官方 Edge Vision SoC 的思路基本一致：它本身就是 **RISC-V + DMA + 外部存储 + Pre-Processor + Post-Processor + Hardware Accelerator + TinyML Accelerator** 的软硬件协同系统。fileciteturn0file8L65-L111\\n\\n官方参考设计也是先对视频做分辨率、格式、灰度等预处理，再通过 DMA 放入外部存储；显示方向则从存储器读出，然后进行 Post-Processing。fileciteturn0file8L114-L173\\n\\n因此它和你们现在的工程不是两种完全不同的架构，而是：\\n\\n\u003e **你们已经把 Edge Vision SoC 的“视频骨架”搭出了一部分，现在缺的是 RISC-V + TinyML 推理这一层。**\\n\\n---\\n\\n# 三、你们现在最需要增加的不是“一个 CNN Verilog 模块”\\n\\n这是一个非常容易走偏的地方。\\n\\n如果直接说：\\n\\n```text\\nOV5640\\n↓\\nCNN.v\\n↓\\nHDMI\\n```\\n\\n会产生大量问题。\\n\\nCNN 并不是 Sobel。\\n\\nSobel 可以：\\n\\n```text\\npixel0\\npixel1\\npixel2\\n...\\n每拍一个像素\\n```\\n\\n经过固定流水线连续输出。\\n\\n而 CNN 一般需要：\\n\\n```text\\n整块 Feature Map\\n↓\\nConv\\n↓\\nFeature Map\\n↓\\nActivation\\n↓\\nDepthwise/Conv\\n↓\\n...\\n↓\\nClassification / Detection\\n```\\n\\n中间还需要：\\n\\n- 权重；\\n- bias；\\n- 中间 feature map；\\n- quantization scale / zero point；\\n- 网络层调度；\\n- Tensor Arena；\\n- 多层存储管理；\\n- 后处理。\\n\\n这就是为什么 TinyML 文档采用：\\n\\n```text\\nTensorFlow Lite\\n        ↓\\nRISC-V\\n        ↓\\nCustom Instruction\\n        ↓\\nTinyML Accelerator\\n        ↓\\nExternal Memory\\n```\\n\\n而不是写一个单独的 `cnn.v`。\\n\\nTinyML Accelerator 本质上是把软件中耗时最大的运算变成硬件 OP，目前资料明确列出的加速操作包括：\\n\\n```text\\nConvolution / Depthwise\\nADD\\nMAXIMUM\\nMULT\\nFully Connected\\n```\\n\\nfileciteturn0file8L280-L291\\n\\n官方介绍也把典型加速算子概括为 Conv2D、Depthwise、Add/Mul、FullyConnected、ReLU/LeakyReLU。fileciteturn0file4L39-L43\\n\\n---\\n\\n# 四、TinyML 到底是什么\\n\\n这里需要把几个概念拆开。\\n\\n**TinyML ≠ 一个神经网络。**\\n\\n你们资料里的 TinyML 是一套：\\n\\n```text\\n模型\\n+\\nTensorFlow Lite 推理运行时\\n+\\nRISC-V CPU\\n+\\nFPGA AI Accelerator\\n+\\n模型转换/参数生成工具\\n+\\n存储/视频系统\\n```\\n\\n构成的完整边缘 AI 平台。\\n\\n官方资料给出的基本架构是：\\n\\n```text\\nTensorFlow Lite\\n       ↓\\nRISC-V Software\\n       ↓\\nCustom Instruction\\n       ↓\\nEfinix TinyML Accelerator\\n       ↓\\nFPGA RTL\\n```\\n\\n主要面向 **INT8 量化模型**，并允许用户配置加速模块资源、甚至定义自己的加速算子。fileciteturn0file4L23-L28\\n\\n---\\n\\n# 五、它为什么一定要 INT8\\n\\nCNN 最核心的计算其实就是 MAC：\\n\\n\\\\[\\ny=\\\\sum_i w_i x_i+b\\n\\\\]\\n\\n如果全部使用 FP32：\\n\\n\\\\[\\n32\\\\text{-bit floating point}\\n\\\\]\\n\\nFPGA 上面积、带宽和功耗都会很高。\\n\\nTinyML 的主要方案是：\\n\\n\\\\[\\nFP32 \\\\rightarrow INT8\\n\\\\]\\n\\n例如：\\n\\n\\\\[\\nx_{float}\\n\\\\approx\\ns(x_{int8}-z)\\n\\\\]\\n\\n其中：\\n\\n- \\\\(s\\\\)：scale；\\n- \\\\(z\\\\)：zero point。\\n\\nCNN 中：\\n\\n\\\\[\\nw_{int8}\\\\times x_{int8}\\n\\\\]\\n\\n产生的结果一般先在更宽的整数累加器中累积，例如 INT32，再 requantize 回 INT8。\\n\\n这使卷积变成 FPGA 非常喜欢的：\\n\\n```text\\n8bit × 8bit\\n+\\naccumulate\\n```\\n\\n而 Ti60 本身正好具有大量 DSP。\\n\\nTi60 数据手册给出的器件资源为：\\n\\n- 60,800 LE；\\n- 2.6 Mbit Embedded Memory；\\n- 256 个 10-Kbit RAM block；\\n- 160 个 DSP block。fileciteturn0file2L101-L136\\n\\nDSP 自身支持乘法、加减、累加，并具有多种整数并行模式。fileciteturn0file2L298-L317\\n\\n因此：\\n\\n\u003e **INT8 TinyML + Ti60 DSP 是天然匹配的计算模式。**\\n\\n---\\n\\n# 六、TinyML 加速到底是怎么发生的\\n\\n这里是这套系统最值得你们比赛展示的部分。\\n\\n假设 TFLite 要计算：\\n\\n\\\\[\\ny=a+b\\n\\\\]\\n\\n纯 RISC-V 软件可能需要：\\n\\n```text\\nload a\\nload b\\nscale\\nshift\\nadd\\nrequantize\\nclip\\nstore\\n```\\n\\n大量指令串行执行。\\n\\nTinyML 可以让 CPU 发出一条：\\n\\n```text\\nCUSTOM ADD\\n```\\n\\n然后 FPGA 内部的专用硬件一次完成这一系列运算。\\n\\n你们上传的 Custom Instruction 文档里明确描述了这个接口：\\n\\n```text\\nCPU\\n │\\n ├ cmd_valid\\n ├ cmd_ready\\n ├ function_id\\n ├ input_0\\n └ input_1\\n       ↓\\n   Custom ALU\\n       ↓\\n ├ rsp_valid\\n ├ rsp_ready\\n └ output\\n```\\n\\n也就是一个典型的 `valid/ready` 请求—响应通道。fileciteturn0file5L16-L31\\n\\n不同运算通过 `function_id` 区分，RTL 侧执行计算后通过 response 通道返回结果。fileciteturn0file5L35-L47\\n\\n所以完整关系实际上是：\\n\\n```text\\nmain.cc\\n   ↓\\nTFLite Micro\\n   ↓\\nConv2D()\\n   ↓\\nEfinix optimized kernel\\n   ↓\\nCustom Instruction\\n   ↓\\nTinyML Accelerator RTL\\n   ↓\\nDSP / BRAM / AXI\\n```\\n\\n而不是：\\n\\n```text\\nC程序自己一项项算整个CNN\\n```\\n\\n---\\n\\n# 七、TensorFlow Lite 在这里干什么\\n\\nTensorFlow Lite 负责的是“网络执行逻辑”。\\n\\n例如一个网络：\\n\\n```text\\nConv\\n↓\\nReLU\\n↓\\nDepthwise\\n↓\\nConv\\n↓\\nAdd\\n↓\\nFC\\n```\\n\\nTFLite Interpreter 会逐层执行。\\n\\nTinyML 则把其中最耗时间的：\\n\\n```text\\nConv\\nDepthwise\\nAdd\\nMul\\nFC\\n```\\n\\n替换成 FPGA 加速实现。\\n\\n因此 RISC-V 仍然非常重要，它负责：\\n\\n```text\\n模型初始化\\nTensor 管理\\nLayer 调度\\nDMA\\n硬件控制\\n结果解析\\n后处理\\n系统控制\\n```\\n\\n而 FPGA Accelerator 负责：\\n\\n```text\\n大量重复数值计算\\n```\\n\\n这是典型的：\\n\\n\\\\[\\n\\\\boxed{\\\\text{Software control + Hardware acceleration}}\\n\\\\]\\n\\n---\\n\\n# 八、你们实际从训练到上板的完整流程\\n\\n官方资料把流程概括得很清楚：\\n\\n\\\\[\\n\\\\boxed{\\\\text{模型开发}\\\\rightarrow\\\\text{模型量化}\\\\rightarrow\\\\text{数据导出}\\\\rightarrow\\\\text{硬件部署}}\\n\\\\]\\n\\nfileciteturn0file4L46-L50\\n\\n结合你们项目，我建议实际做成下面 8 个阶段：\\n\\n1. **PC 上训练模型**。Python + TensorFlow/Keras，先只关心精度，不碰 FPGA。\\n\\n2. **控制模型结构**。优先使用 TinyML 已知支持良好的算子，如 `Conv2D / DepthwiseConv2D / Add / Mul / FullyConnected / ReLU`，尽量避免非常复杂或不受支持的层。\\n\\n3. **Post-Training Quantization**，把 FP32 模型量化成 INT8 `.tflite`。\\n\\n4. **TinyML Generator 解析模型**。官方工具会自动分析加速算子、配置 Accelerator 参数、估算资源并导出工程数据。fileciteturn0file4L53-L57\\n\\n5. **生成软硬件两套配置**。软件侧需要模型数据和参数；RTL 侧需要相应 accelerator 参数。这里必须保证两边启用的算子完全对应。\\n\\n6. **Efinity 中搭建 Sapphire SoC + TinyML Accelerator + DDR3/AXI**。\\n\\n7. **RISC-V 中运行 TFLite**，输入 Tensor → `Invoke()` → 输出 Tensor → post-processing。\\n\\n8. **把结果叠加回 HDMI**，例如：\\n\\n```text\\nPerson 92%\\nFace\\nGesture: OK\\nBottle 86%\\n```\\n\\n或者直接画：\\n\\n```text\\nbounding box\\nlandmark\\nOCR字符\\n```\\n\\n---\\n\\n# 九、人脸、手势、物品、文字四种功能不能用同一种思路\\n\\n这是后续选题非常重要的一点。\\n\\n| 功能 | 实际 AI 任务 | 第一版建议 |\\n|---|---|---|\\n| 人脸 | detection / landmark / identity recognition | 先 Face Landmark / Face Detection |\\n| 手势 | image classification / hand detection | 静态手势分类 |\\n| 物品 | classification / object detection | 先分类，再检测 |\\n| 文字 | character classification / OCR | 先数字/字母识别 |\\n| 完整 OCR | detection + recognition + sequence decoding | 后期再考虑 |\\n\\nTinyML 官方资料已经提供了一些非常有价值的参考模型：\\n\\n| 示例 | 输入 |\\n|---|---:|\\n| YOLO Person Detection | 96×96×3 |\\n| MobileNetV1 Person Detection | 96×96×1 |\\n| ResNet Image Classification | 32×32×3 |\\n| MediaPipe Face Landmark | 192×192×3 |\\n\\nfileciteturn0file4L68-L79\\n\\n这张表其实给你们指出了模型规模的大概量级。\\n\\n---\\n\\n# 十、人脸识别怎么做\\n\\n首先最好把“人脸识别”拆成三个概念：\\n\\n```text\\nFace Detection\\n找到哪里有人脸\\n\\nFace Landmark\\n找到眼睛、鼻子、嘴等关键点\\n\\nFace Recognition\\n判断这个人是谁\\n```\\n\\n你们提供的 TinyML Demo 是 **Face Landmark**，不是身份证式的“这个人是谁”。用户手册里列出的现成应用也包含 `face_landmark`，同时还有 YOLO Person、ResNet 分类等。fileciteturn0file8L263-L278\\n\\n第一版非常适合做：\\n\\n```text\\nCamera\\n↓\\n192×192 RGB\\n↓\\nFace Landmark\\n↓\\n468 landmarks\\n↓\\nHDMI画关键点\\n```\\n\\n视觉效果会非常明显。\\n\\n之后如果要真正做 identity：\\n\\n```text\\nFace Detection\\n↓\\nCrop Face\\n↓\\nEmbedding CNN\\n↓\\n128D/256D vector\\n↓\\nCosine similarity\\n↓\\nAndrew / Alice / Unknown\\n```\\n\\n这个复杂度明显更高，不建议作为第一个 TinyML milestone。\\n\\n---\\n\\n# 十一、手势识别\\n\\n如果你们做：\\n\\n```text\\n✊\\n✋\\n👌\\n👍\\n✌\\n```\\n\\n这种静态手势，最简单。\\n\\n例如：\\n\\n```text\\nCamera\\n↓\\nROI\\n↓\\n96×96\\n↓\\nMobileNet-small / 自定义CNN\\n↓\\n5-class Softmax\\n```\\n\\n输出：\\n\\n```text\\nOpen hand 0.93\\nFist      0.04\\nOK        0.02\\n...\\n```\\n\\n这类问题本质是 **Image Classification**，非常适合 TinyML。\\n\\n如果做：\\n\\n```text\\n挥手\\n左滑\\n右滑\\n旋转\\n```\\n\\n则变成时间序列：\\n\\n\\\\[\\nI_{t-3},I_{t-2},I_{t-1},I_t\\n\\\\]\\n\\n需要多帧模型或特征缓存，工程复杂度会上一个台阶。\\n\\n所以比赛第一阶段我建议：\\n\\n\u003e **静态手势，而不是动态手势。**\\n\\n---\\n\\n# 十二、物品识别\\n\\n也分两种。\\n\\n简单版：\\n\\n```text\\n整幅图片\\n↓\\nCNN\\n↓\\napple / bottle / phone / cup\\n```\\n\\n叫 Image Classification。\\n\\n高级版：\\n\\n```text\\n图片\\n↓\\nYOLO\\n↓\\n[x,y,w,h,class,score]\\n```\\n\\n叫 Object Detection。\\n\\n你们官方 TinyML 示例里已经有 96×96×3 的 YOLO Person Detection，所以检测路线原则上是存在的。fileciteturn0file4L68-L75\\n\\n但是第一版建议先做 classification，因为：\\n\\n```text\\nClassification\\n        ↓\\n模型小\\n后处理简单\\n验证容易\\n```\\n\\n而 Detection 还需要：\\n\\n```text\\nBounding box decode\\nconfidence\\nNMS\\ncoordinate scaling\\noverlay\\n```\\n\\n工程复杂度大很多。\\n\\n---\\n\\n# 十三、OCR 最好不要一开始做“任意文字识别”\\n\\n完整 OCR 实际是：\\n\\n```text\\n文字区域检测\\n↓\\n透视/旋转校正\\n↓\\n字符/文本行识别\\n↓\\nCTC / sequence decoding\\n```\\n\\n这对于 Ti60 第一版 TinyML 非常重。\\n\\n更适合 FPGA 比赛的方案是：\\n\\n```text\\nCamera\\n↓\\n灰度\\n↓\\nthreshold / Sobel\\n↓\\n字符区域分割\\n↓\\n32×32 CNN\\n↓\\n0~9 / A~Z\\n```\\n\\n这里恰好可以把你们已经实现的：\\n\\n```text\\nMedian\\nSobel\\nthreshold\\n```\\n\\n变成真正有用的 AI 前处理模块。\\n\\n于是整个系统不是“旧工程作废换神经网络”，而是：\\n\\n```text\\n传统 FPGA ISP\\n        +\\nTinyML CNN\\n```\\n\\n例如：\\n\\n```text\\nMedian\\n↓\\nSobel\\n↓\\nROI segmentation\\n↓\\nCNN classifier\\n```\\n\\n这个作为比赛展示其实非常漂亮。\\n\\n---\\n\\n# 十四、最适合你们现在工程的 AI 数据支路\\n\\n我建议增加一个：\\n\\n```text\\nai_preprocessor\\n```\\n\\n不要破坏当前 HDMI 主链。\\n\\n例如：\\n\\n```text\\n                    DDR3\\n                     │\\n       ┌─────────────┴─────────────┐\\n       │                           │\\n Display Reader               AI Reader\\n       │                           │\\n lcd_driver                  crop/resize\\n       │                           │\\n Median/Sobel                 RGB→INT8\\n       │                           │\\n HDMI                    TinyML Accelerator\\n                                   │\\n                              result FIFO\\n                                   │\\n                              bbox/class\\n                                   │\\n                          HDMI Overlay\\n```\\n\\n这样显示可以一直保持：\\n\\n\\\\[\\n1280\\\\times720@60\\n\\\\]\\n\\n而 AI 可以只处理：\\n\\n\\\\[\\n96\\\\times96\\n\\\\]\\n\\n甚至只推理：\\n\\n\\\\[\\n5\\\\sim15\\\\text{ FPS}\\n\\\\]\\n\\n完全没有必要让 CNN 跑 60 FPS。\\n\\n这会大幅降低：\\n\\n- DDR 带宽；\\n- RISC-V 压力；\\n- TinyML Accelerator 压力；\\n- 功耗；\\n- 资源。\\n\\n---\\n\\n# 十五、甚至可以不让 AI 读取完整 720p DDR 帧\\n\\n还有一个很值得考虑的优化。\\n\\n现在摄像头流：\\n\\n```text\\n1280x720\\n```\\n\\n进入 DDR 前，可以额外分一路：\\n\\n```text\\nCamera pixel\\n      ├─→ 原来的1280×720 DDR\\n      │\\n      └─→ DownSampler\\n                ↓\\n             96×96\\n                ↓\\n            AI Buffer\\n```\\n\\n例如每隔若干像素采样一次。\\n\\n这样：\\n\\n\\\\[\\n1280\\\\times720\\\\times3\\n\\\\]\\n\\n约 2.76 MB/frame，\\n\\n而：\\n\\n\\\\[\\n96\\\\times96\\\\times3\\n=\\n27648\\\\text{ bytes}\\n\\\\]\\n\\n只有约 **27 KB**。\\n\\n内存流量一下缩小约两个数量级。\\n\\n我比较推荐后面走这个方案：\\n\\n```text\\nCamera\\n ├────────────→ DDR/HDMI\\n │\\n └→ NN Preprocessor → AI Buffer → TinyML\\n```\\n\\n这样 TinyML 和显示系统解耦得最干净。\\n\\n---\\n\\n# 十六、你们当前硬件很适合走这个方向\\n\\nTi60 F225 有：\\n\\n\\\\[\\n160\\\\ DSP\\n\\\\]\\n\\n和：\\n\\n\\\\[\\n256\\\\times10\\\\text{ Kbit RAM}\\n\\\\]\\n\\nfileciteturn0file2L120-L136\\n\\n你们现在仓库里的 Sobel 版本，文档记录整工程只使用了约 50 个 EFX_RAM10，因此目前图像处理版本本身并没有吃光 RAM。\\n\\n不过官方 EVSOC 参考设计给出的完整设计资源已经到了：\\n\\n```text\\n28265 LUT\\n211 M10K\\n```\\n\\n其中 Sapphire RISC-V 自身也占用了约：\\n\\n```text\\n7301 LUT\\n59 M10K\\n4 DSP\\n```\\n\\nfileciteturn0file8L174-L182\\n\\n所以这也是我不建议直接把完整 EVSOC 示例一股脑和你们当前所有模块合并的原因。\\n\\n必须做 **资源规划**。\\n\\n---\\n\\n# 十七、TinyML 和你们现有 DDR3 反而有一个很不错的契合点\\n\\nTinyML 官方参考架构经常以 HyperRAM 作为外部内存；用户手册中 TinyML Accelerator 的 AXI 一侧连接外部存储。fileciteturn0file8L280-L286\\n\\n你们现在则已经有：\\n\\n```text\\nDDR3\\n+\\nAXI\\n+\\nFrame Buffer\\n```\\n\\n当前 `example_top.v` 的 DDR user-side data bus 是：\\n\\n```verilog\\nwire [127:0] w_ddr3_wdata;\\nwire [127:0] w_ddr3_rdata;\\n```\\n\\n也就是 **128-bit AXI 数据路径**。\\n\\nTinyML 配置工具的参考配置恰好也是围绕较宽 AXI 数据访问设计的。\\n\\n所以真正移植时，我并不建议再照官方参考板额外做一个 HyperRAM 子系统，而是：\\n\\n\u003e **保留现有 DDR3 controller，把 TinyML Accelerator 的 memory master 接入现有 AXI/DDR3 架构。**\\n\\n这会是后续 RTL 架构改造的核心工作之一。\\n\\n不过官方 TinyML User Guide 本身是 Draft，里面有些地方写 HyperRAM，有些 DMA 段落又写外部 DDR DRAM，所以这部分不要机械照抄；你们最终工程应以实际板卡上的 DDR3 为准。\\n\\n---\\n\\n# 十八、这个仓库现在还缺什么\\n\\n这是我检查 GitHub 后得到的一个很明确的结论：\\n\\n当前 `main/src/` 中**没有 TinyML Accelerator / Sapphire SoC / TensorFlow Lite RISC-V 软件工程**。\\n\\n现在主要是：\\n\\n```text\\nsrc/\\n├─ axi/\\n├─ cmos_i2c/\\n├─ control/\\n├─ hdmi_ip/\\n├─ isp/\\n├─ ddr_rw_ctrl.v\\n├─ lcd_driver.v\\n...\\n```\\n\\nTinyML 相关目前主要存在于：\\n\\n```text\\ndocs/resources/\\n├─ 1、TinyML介绍.pdf\\n├─ 2、RISCV Custom Instruction.pdf\\n├─ 3、钛金FPGA DSP原语介绍.pdf\\n├─ 4、TinyML 框架介绍.pdf\\n└─ 1_3_EVSOC_tinyml用户手册_0416.pdf\\n```\\n\\n因此后面不是简单：\\n\\n```verilog\\ntinyml u_tinyml(...);\\n```\\n\\n就结束。\\n\\n你们还需要真正引入：\\n\\n```text\\nSapphire SoC\\nTensorFlow Lite Micro\\nTinyML accelerator RTL\\nTinyML driver\\nmodel generator\\nRISC-V firmware project\\n```\\n\\n官方框架的核心就是 TensorFlow Lite + INT8 + RISC-V + 可配置硬件 Accelerator。fileciteturn0file4L23-L28\\n\\n---\\n\\n# 十九、我建议你们按这个迭代顺序做\\n\\n这是我认为目前风险最低的实施路线：\\n\\n1. **Milestone 0：保持现在工程不动。** 确保 Camera → DDR3 → HDMI 和现有 Sobel/Median 仍然稳定，TinyML 另开分支开发。\\n\\n2. **Milestone 1：TinyML 独立跑通。** 暂时完全不要接摄像头。使用官方现成 `.tflite` 和固定测试图片，先让 `Sapphire + TFLite + TinyML Accelerator` 在 Ti60 上完成一次 inference。\\n\\n3. **Milestone 2：接自己的模型。** 建议先做最简单的 32×32 或 64×64 图像分类，例如 3～5 类物品或静态手势，完成 `train → INT8 → tflite → generator → board inference` 全链路。\\n\\n4. **Milestone 3：AI 输入连接摄像头。** 从 DDR3 或 camera branch 取得 96×96/128×128 图像，并形成 TFLite input tensor。\\n\\n5. **Milestone 4：HDMI 显示识别结果。** 先不要画 bbox，只在画面角落显示 `Class ID + confidence`；之后再增加框和 landmark。\\n\\n6. **Milestone 5：Face Landmark / Person Detection。** 这时再上官方已经验证过的网络类型。\\n\\n7. **Milestone 6：多个 AI 模型。** 通过 UART/按键选择 `Face / Gesture / Object / Character`，而不是同时运行四个网络。\\n\\n8. **Milestone 7：优化。** 根据 profiler 看 Conv/Depthwise/FC 的耗时，再调 TinyML accelerator 的并行度、DSP 和 RAM 配置。\\n\\n---\\n\\n# 二十、比赛最后的系统可以长成这样\\n\\n我认为你们这个项目最终很有潜力变成：\\n\\n```text\\n                   Ti60F225 Edge Vision AI\\n┌─────────────────────────────────────────────────────┐\\n│                                                     │\\n│  OV5640                                             │\\n│    │                                                │\\n│    ▼                                                │\\n│ Camera Capture                                      │\\n│    │                                                │\\n│    ├───────────────► DDR3 ─────► HDMI Pipeline      │\\n│    │                                  │              │\\n│    │                           Median / Sobel         │\\n│    │                                  │              │\\n│    │                              AI Overlay          │\\n│    │                                  │              │\\n│    │                                HDMI             │\\n│    │                                                │\\n│    └──► AI Preprocessor                             │\\n│           │                                         │\\n│       Crop/Resize                                   │\\n│       RGB/Gray                                      │\\n│       Quantize INT8                                 │\\n│           │                                         │\\n│           ▼                                         │\\n│       AI Frame Buffer                               │\\n│           │                                         │\\n│           ▼                                         │\\n│      Sapphire RISC-V                                │\\n│           │                                         │\\n│       TensorFlow Lite                               │\\n│           │                                         │\\n│      Custom Instruction                             │\\n│           │                                         │\\n│           ▼                                         │\\n│       TinyML Accelerator                            │\\n│     Conv / Depthwise / FC                           │\\n│           │                                         │\\n│           ▼                                         │\\n│  Class / bbox / landmark / score                    │\\n│                                                     │\\n└─────────────────────────────────────────────────────┘\\n```\\n\\n这是非常典型的 **FPGA + RISC-V + TinyML + ISP + DDR + HDMI 的软硬件协同 Edge AI 系统**。\\n\\n而且它和你们目前的 Sobel 项目不是两个项目——现有工程完全可以作为 **Video/ISP subsystem** 保留下来。\\n\\n---\\n\\n## 最值得先做的第一个 AI Demo\\n\\n从工程难度、成功率和后续扩展能力来看，我建议你们的第一个 TinyML 网络不要直接上“完整人脸识别”或“OCR”，而是：\\n\\n\\\\[\\n\\\\boxed{\\\\text{Camera → 96×96 → INT8 CNN → 静态手势/物品分类 → HDMI显示结果}}\\n\\\\]\\n\\n先把下面这条链真正跑通：\\n\\n```text\\n自己训练\\n   ↓\\nquantization\\n   ↓\\n.tflite\\n   ↓\\nTinyML Generator\\n   ↓\\nRISC-V + Accelerator\\n   ↓\\n真实摄像头输入\\n   ↓\\n真实 Ti60 推理\\n   ↓\\nHDMI显示分类结果\\n```\\n\\n**这一步一旦成功，后面人脸、YOLO、字符识别主要就是“换模型 + 换预后处理”，而不是重新搭系统。**\\n\\n然后第二个 Demo 再做官方资料已经给出参考的 **MediaPipe Face Landmark**，因为官方 TinyML 示例本身已经包含 face landmark、person detection、image classification 等方向。fileciteturn0file8L263-L278\\n\\n下一步我建议就直接进入真正的工程设计：**我可以基于你们当前 `fpga-w.-codex` 的 `example_top.v + DDR3 AXI + video_processing`，给你画出“TinyML V0.1”的模块级架构，明确应该新增哪些 `.v/.sv/.cc`、每个模块的输入输出，以及 TinyML Accelerator 应该具体插在现有工程哪里。** memcite\",\"role\",\"assistant\",{},{\"_307\":311,\"_314\":875,\"_54\":876,\"_56\":876,\"_318\":877,\"_320\":321,\"_322\":14,\"_323\":324,\"_325\":878,\"_327\":328},\"b24adb7f-def8-4749-b685-afe0a3b88c06\",[81],{\"_869\":870,\"_325\":892},1790648849.201046,{\"_865\":890,\"_318\":891},{\"_879\":880,\"_881\":882,\"_883\":884,\"_885\":886,\"_887\":888,\"_347\":348,\"_349\":14,\"_350\":351,\"_352\":353,\"_354\":355,\"_356\":355,\"_340\":67,\"_357\":67,\"_66\":67,\"_358\":359,\"_360\":14,\"_361\":873,\"_889\":34,\"_364\":10},\"reasoning_status\",\"reasoning_ended\",\"finished_duration_sec\",143,\"reasoning_start_time\",1790648705.990413,\"reasoning_end_time\",1790648849.1672983,\"reasoning_recap_type\",\"collapse\",\"hide_inline_actions\",\"reasoning_recap\",\"思考了 2m 23s\",{},{\"_307\":873,\"_314\":896,\"_54\":897,\"_56\":897,\"_318\":898,\"_320\":321,\"_322\":14,\"_323\":324,\"_325\":899,\"_327\":328},\"97f51b23-105d-4be0-b7b6-5e7e32b1ac86\",[311],{\"_869\":870,\"_325\":927},1790648849.196832,{\"_865\":916,\"_916\":917,\"_918\":919},{\"_900\":901,\"_879\":902,\"_903\":904,\"_905\":906,\"_907\":908,\"_883\":884,\"_347\":348,\"_909\":910,\"_349\":14,\"_350\":351,\"_352\":353,\"_354\":355,\"_356\":355,\"_340\":67,\"_357\":67,\"_66\":67,\"_358\":359,\"_360\":14,\"_361\":911,\"_889\":34,\"_364\":10},\"inline_cot_expandable_content\",{\"_913\":914},\"is_reasoning\",\"tool_summary_type\",\"files\",\"tool_icons\",[912],\"classifier_response\",\"default\",\"skip_reasoning_title\",\"跳过\",\"62324ecc-44f1-4769-8052-629f8f827364\",\"api_tool\",\"source_message_ids\",[915],\"b5b54a56-359b-486f-9c08-6ac79b1bcc28\",\"thoughts\",[920],\"source_analysis_msg_id\",\"b237a90d-004c-4ab3-9c6b-819047f92bdf\",{\"_921\":922,\"_318\":923,\"_924\":925,\"_926\":34},\"summary\",\"解读TinyML部署与FPGA分支下采样方案\",\"\",\"chunks\",[],\"finished\",{},{\"_307\":894,\"_314\":931,\"_54\":932,\"_56\":9
